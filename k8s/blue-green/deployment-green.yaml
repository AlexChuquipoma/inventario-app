apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventario-app-green
  labels:
    app: inventario-app
    slot: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventario-app
      slot: green
  template:
    metadata:
      labels:
        app: inventario-app
        slot: green
    spec:
      containers:
        - name: inventario-app
          image: ghcr.io/alexchuquipoma/inventario-app:117567a11a86c3bf5d9b3ae75a05be96a190a0ff
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: APP_VERSION
              value: "green-117567a"
            - name: APP_COLOR
              value: "green"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
