apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventario-app-blue
  labels:
    app: inventario-app
    slot: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventario-app
      slot: blue
  template:
    metadata:
      labels:
        app: inventario-app
        slot: blue
    spec:
      containers:
        - name: inventario-app
          image: ghcr.io/alexchuquipoma/inventario-app:05684102ac7b3af3293560e7df628ded99b1ff03
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: APP_VERSION
              value: "blue-0568410"
            - name: APP_COLOR
              value: "blue"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
